<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>Stream Captions</h1>

  <!-- Shown when the content script isn't running on this tab: either the page
       predates the install (reload), or the site needs opt-in access. -->
  <div class="notice hidden" id="notice">
    <p id="notice-text"></p>
    <button id="notice-action" class="hidden"></button>
  </div>

  <div id="controls">
    <label class="row toggle">
      <span>Captions</span>
      <input type="checkbox" id="enabled" />
    </label>

    <label class="row">
      <span>Language</span>
      <select id="language">
        <option value="english" selected>English</option>
        <option value="" disabled>More languages — coming soon</option>
      </select>
    </label>

    <label class="row">
      <span>Model</span>
      <select id="model">
        <option value="Xenova/whisper-tiny" selected>Tiny (fastest)</option>
        <option value="Xenova/whisper-base">Base (balanced)</option>
        <option value="Xenova/whisper-small">Small (most accurate)</option>
      </select>
    </label>

    <label class="row">
      <span>Position</span>
      <select id="position">
        <option value="bottom-center" selected>Bottom center</option>
        <option value="bottom-left">Bottom left</option>
        <option value="bottom-right">Bottom right</option>
        <option value="top-center">Top center</option>
      </select>
    </label>
  </div>

  <p class="hint">Runs on Kick and Twitch out of the box — any other site can be enabled per-site. First run downloads the model (cached afterward); switching models reloads on the fly.</p>

  <footer class="support">
    <span class="support-title">Free &amp; open source — donations welcome:</span>
    <!-- The button image is bundled locally on purpose: hot-linking it would
         contact nowpayments.io every time the popup opens. Nothing is requested
         until the user actually clicks through. -->
    <a href="https://nowpayments.io/donation?api_key=38f0255c-24e3-4e15-b47f-dbdd2cac8465"
       target="_blank" rel="noreferrer noopener">
      <img src="nowpayments-donate.svg" alt="Donate crypto via NOWPayments" />
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
